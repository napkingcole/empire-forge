repo_url: "https://github.com/napkingcole/aoe2-empire-forge"
releases_url: "https://github.com/napkingcole/aoe2-empire-forge/releases/latest"
issues_url: "https://github.com/napkingcole/aoe2-empire-forge/issues"
# Empty until the Store listing is live; the Download page shows "coming soon".
